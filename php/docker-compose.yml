services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./assets/images/uploads:/var/www/html/assets/images/uploads
            - ./assets/images/processed:/var/www/html/assets/images/processed
        environment:
            - APACHE_DOCUMENT_ROOT=/var/www/html
            - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
            - SMTP_PORT=${SMTP_PORT:-587}
            - SMTP_USER=${SMTP_USER}
            - SMTP_PASS=${SMTP_PASS}
            - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@camagru.com}
            - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Camagru}

networks:
    camagru-network:
        driver: bridge
